name: Video agent (local pipeline)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/video-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/video-agent/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/video-agent/python/requirements-test.txt
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m pip install -r python/requirements-test.txt
      - run: python -m unittest discover -s tests/python -v
      - run: bash -n python/setup_models.sh
      # No TTS/avatar models, torch, Chrome, API keys, or real video render in CI.
